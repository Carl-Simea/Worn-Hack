<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=640, initial-scale=1, user-scalable=no">
<title>Scribi</title>
<link rel="stylesheet" href="/static/web/fonts.css">
<style>
  /* 640×480 waveguide: black is see-through. Bright text, one accent, big type. */
  :root { --fg:#f4f1ea; --dim:#8b909a; --faint:#3a3f48; --say:#5ef08a; --acc:#ff6a4d; --blue:#9fb4ff; --gold:#ffd23d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:640px; height:480px; overflow:hidden; background:#000; color:var(--fg);
    font-family:"Inter", "Roboto", sans-serif; -webkit-font-smoothing:antialiased; }
  #top { position:absolute; left:0; right:0; top:34px; height:30px; padding:0 22px; display:flex; align-items:center;
    font-size:17px; color:var(--dim); white-space:nowrap; }
  /* simple: the screen title says where you are, so the breadcrumb isn't drawn (still reported to /app-state) */
  #crumb { flex:1; visibility:hidden; }
  #crumb b { color:var(--fg); font-weight:600; }
  #mic { display:flex; align-items:center; gap:8px; font-size:16px; color:var(--dim); }
  #mic i { width:12px; height:12px; border-radius:50%; background:var(--faint); display:inline-block; }
  #mic.listening i { background:var(--say); box-shadow:0 0 8px var(--say); }
  #mic.hearing i { background:var(--gold); box-shadow:0 0 10px var(--gold); animation:pulse .5s infinite alternate; }
  #mic.thinking i { background:var(--blue); animation:pulse .3s infinite alternate; }
  #mic.speaking i { background:var(--blue); }
  @keyframes pulse { to { transform:scale(1.35); } }
  #main { position:absolute; left:0; right:0; top:68px; bottom:92px; padding:0 22px; }
  #bottom { position:absolute; left:0; right:0; bottom:0; height:92px; padding:30px 22px 14px; }
  #hint { font-size:22px; color:var(--say); font-weight:500; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* clean look: one spoken hint on the optics. hint2 is still reported to /app-state (and /live), just not drawn here */
  #hint2 { display:none; }
  #heard { position:absolute; right:22px; bottom:58px; font-size:15px; color:var(--blue); max-width:300px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:opacity .3s; }
  #heard.on { opacity:1; }
  #toast { position:absolute; left:60px; right:60px; bottom:100px; text-align:center; font-size:21px; color:var(--fg);
    background:rgba(0,0,0,.94); border:2px solid var(--blue); border-radius:14px; padding:9px 14px; display:none; z-index:50; }

  /* menus */
  .title { font-family:"Newsreader", Georgia, serif; font-size:40px; line-height:1.1; margin:4px 0 10px; }
  .title small { font-family:"Inter", sans-serif; font-size:18px; color:var(--dim); margin-left:10px; }
  .menu { list-style:none; }
  .menu li { display:flex; align-items:center; height:44px; padding:0 14px; border-radius:12px; font-size:24px; color:var(--fg); }
  .menu li .n { width:30px; color:var(--dim); font-size:18px; }
  .menu li .k { flex:1; }
  .menu li .x { color:var(--dim); font-size:19px; }
  /* clean menu: no boxes. Selected row = accent bar + bright text; the side note only shows on the selected row */
  .menu li { color:#b9bcc3; }
  .menu li .x { display:none; }
  .menu li.sel { color:var(--fg); box-shadow:inset 4px 0 0 var(--say); border-radius:2px; font-weight:600; }
  .menu li.sel .n { color:var(--say); }
  .menu.two { columns:2; column-gap:14px; }
  .menu.two li { break-inside:avoid; }
  .hero { font-size:28px; margin-right:12px; min-width:124px; display:inline-block; }

  /* lesson */
  #lesson { display:flex; height:100%; }
  #board { position:relative; width:300px; height:300px; flex:none; }
  #board .grid { position:absolute; top:0;left:0;right:0;bottom:0; border:0; }
  #board .grid:before, #board .grid:after { content:""; position:absolute; background:#171a20; }
  #board .grid:before { left:50%; top:0; bottom:0; width:1px; }
  #board .grid:after { top:50%; left:0; right:0; height:1px; }
  #ink { position:absolute; top:0;left:0;right:0;bottom:0; }
  #side { flex:1; padding-left:22px; display:flex; flex-direction:column; min-width:0; }
  #strip { font-size:34px; letter-spacing:4px; white-space:nowrap; overflow:hidden; color:var(--faint); padding-left:2px; }
  #strip .done { color:var(--dim); } #strip .cur { color:var(--fg); border-bottom:3px solid var(--say); }
  #rom { font-size:32px; color:var(--blue); font-weight:600; margin-top:6px; }
  #meaning { font-size:24px; margin-top:2px; }
  #phase { margin-top:auto; font-size:20px; color:var(--dim); text-transform:uppercase; letter-spacing:2px; }
  #step { font-size:34px; font-weight:700; color:var(--fg); margin-top:2px; }
  #bar { height:6px; background:#1d2127; border-radius:3px; margin-top:8px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--say); }
  #res { position:absolute; top:-10px;left:0;right:0;bottom:0; z-index:5; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; background:#000; }
  #res .score { font-size:96px; font-weight:800; line-height:1; }
  #res .line { font-size:28px; margin-top:10px; max-width:560px; }
  #res .fix { font-size:22px; color:var(--gold); margin-top:12px; max-width:560px; }
  #res.ok .score { color:var(--say); } #res.no .score { color:var(--acc); }
  /* accuracy ring around the character */
  #ring { position:absolute; left:-6px; top:-6px; width:312px; height:312px; pointer-events:none; }
  #ring circle { fill:none; stroke-width:6; }
  #ring .track { stroke:#15181d; }
  #ring .fill { stroke:#3a3f48; stroke-linecap:round; transform:rotate(-90deg); transform-origin:156px 156px;
    transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1), stroke .4s; }
  #ringPct { position:absolute; right:6px; top:6px; font-size:18px; font-weight:700; color:var(--dim); transition:color .4s; }
  .pop { position:absolute; right:14px; top:30px; font-size:30px; font-weight:800; pointer-events:none;
    animation:pop 1.2s cubic-bezier(.2,.8,.2,1) forwards; text-shadow:0 0 12px rgba(0,0,0,.9); }
  @keyframes pop { 0% { opacity:0; transform:translateY(14px) scale(.7); } 18% { opacity:1; transform:translateY(0) scale(1.12); }
    70% { opacity:1; transform:translateY(-16px) scale(1); } 100% { opacity:0; transform:translateY(-30px) scale(.96); } }
  .red { color:#ff5a4a !important; } .amber { color:#ffbf3a !important; } .green { color:#5ef08a !important; }

  /* analysing: a light sweep over the character + three steps */
  #scan { position:absolute; left:0; right:0; top:0; bottom:0; overflow:hidden; display:none; pointer-events:none; }
  #scan i { position:absolute; left:-10%; right:-10%; height:70px; top:-70px;
    background:linear-gradient(180deg, rgba(110,190,255,0) 0%, rgba(110,190,255,.18) 55%, rgba(170,225,255,.85) 92%, rgba(110,190,255,0) 100%);
    animation:sweep 1.25s cubic-bezier(.45,.05,.55,.95) infinite; will-change:transform; }
  #scan b { position:absolute; left:0; right:0; top:0; bottom:0; background:rgba(0,0,0,.25); }
  @keyframes sweep { from { transform:translateY(0); } to { transform:translateY(370px); } }
  #checklist { display:none; margin-top:auto; }
  #checklist div { font-size:21px; height:38px; display:flex; align-items:center; color:#4b505a; transition:color .3s; }
  #checklist div em { width:28px; height:28px; margin-right:10px; border-radius:50%; border:2px solid #2a2e35; display:inline-flex;
    align-items:center; justify-content:center; font-style:normal; font-size:17px; flex:none; transition:all .3s; }
  #checklist div.on { color:var(--fg); }
  #checklist div.on em { border-color:var(--blue); border-top-color:transparent; animation:sp .8s linear infinite; }
  #checklist div.ok { color:var(--fg); }
  #checklist div.ok em { border-color:var(--say); background:var(--say); color:#000; animation:none; }

  /* result: count-up inside a big ring */
  #res .dial { position:relative; width:210px; height:210px; }
  #res .dial svg { position:absolute; left:0; top:0; width:210px; height:210px; transform:rotate(-90deg); }
  #res .dial circle { fill:none; stroke-width:12; stroke-linecap:round; }
  #res .dial .num { position:absolute; left:0; right:0; top:58px; text-align:center; font-size:84px; font-weight:800; line-height:1; }
  #res .dial .of { position:absolute; left:0; right:0; top:146px; text-align:center; font-size:17px; color:var(--dim); }
  #res .line, #res .fix { opacity:0; transform:translateY(8px); transition:opacity .35s, transform .35s; }
  #res.shown .line, #res.shown .fix { opacity:1; transform:none; }
  .spin { width:54px; height:54px; border:5px solid #222; border-top-color:var(--blue); border-radius:50%; animation:sp 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* name / compose */
  .big { font-size:54px; line-height:1.15; margin:6px 0; }
  .rows div { font-size:30px; height:48px; display:flex; align-items:center; }
  .rows div span { width:150px; color:var(--dim); font-size:18px; }
  .rows div.sel { outline:2px solid var(--say); border-radius:10px; padding-left:8px; }
  .muted { color:var(--dim); font-size:21px; line-height:1.35; }
  .say { color:var(--say); }
  .jgrid { display:flex; flex-wrap:wrap; gap:10px; }
  .jgrid figure { width:139px; text-align:center; font-size:14px; color:var(--dim); line-height:22px; }
  .jgrid img { width:139px; height:92px; object-fit:cover; border-radius:8px; border:2px solid #222; display:block; }
  .jgrid b { font-size:18px !important; }
  .jgrid figure.ok img { border-color:var(--say); } .jgrid figure.no img { border-color:var(--acc); }
  .jgrid b { color:var(--fg); font-size:22px; margin-right:6px; }
  .cmds div { font-size:21px; height:33px; } .cmds b { color:var(--say); font-weight:600; }
  /* Scribi brand (home) */
  .brand { display:flex; align-items:center; gap:16px; margin:2px 0 14px; }
  .brand .mark { width:96px; height:35px; color:var(--fg); }
  .brand span { font-family:"Newsreader", Georgia, serif; font-size:42px; line-height:1; }
  .title small { display:none; }
  /* Scribi minimal: nothing small on the optics. Everything hidden here is still reported to /app-state and /live. */
  #mic span, #heard, #phase, .menu li .n, #res .dial .of { display:none !important; }
  .menu li { padding-left:18px; }
  #step { margin-top:auto; }
  #ringPct { font-size:24px; }
  #checklist div { font-size:24px; }
  #res .fix { font-size:26px; }
  #toast { font-size:24px; }
  .rows div { padding-left:14px; } .rows div.sel { outline:0; box-shadow:inset 4px 0 0 var(--say); border-radius:2px; padding-left:14px; }
  .rows div span { font-size:22px; width:130px; }
  .muted { font-size:24px; color:#b9bcc3; }
  .jgrid figure { font-size:20px; color:var(--fg); }
  .jgrid b { font-size:22px !important; }
  .cmds div { font-size:0; height:32px; } .cmds b { font-size:23px; color:var(--fg); font-weight:500; }
  .hero { text-align:left; }
  .brand { gap:14px; }
  .brand .mark { width:62px; height:23px; shape-rendering:geometricPrecision; }
  .idlemark { text-align:center; margin-top:130px; color:#4b505a; }
  .idlemark .mark { width:150px; height:55px; }
  /* start animation: the mark draws in left to right like a pen stroke, the name rises in, then it all fades to home */
  #splash { position:absolute; left:0; top:0; right:0; bottom:0; background:#000; z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; transition:opacity .7s ease; }
  #splash.out { opacity:0; }
  #splash .mark { width:240px; height:87px; color:var(--fg); -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0);
    animation:drawIn 1.3s cubic-bezier(.65,0,.35,1) .25s forwards; }
  #splash span { font-family:"Newsreader", Georgia, serif; font-size:46px; margin-top:22px; opacity:0; transform:translateY(10px);
    animation:riseIn .8s cubic-bezier(.2,.8,.2,1) 1.25s forwards; }
  @keyframes drawIn { to { -webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); } }
  @keyframes riseIn { to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="splash"></div>
<div id="top"><div id="crumb"></div><div id="mic"><i></i><span id="micText">…</span></div></div>
<div id="main"></div>
<div id="bottom"><div id="hint"></div><div id="hint2"></div><div id="heard"></div></div>
<div id="toast"></div>

<script src="/static/web/worn-ink.js"></script>
<script src="/static/web/worn-confetti.js"></script>
<script src="/static/web/worn-sfx.js"></script>

  function watch(again) {

    if (!again) say(st.charIdx === 0 && s.meaning ? s.meaning + ". Watch the strokes, then write along." : "Next character. Watch.");

  }

  function yourTurn() {

    say("Say check when you're done.");

  }

  function check() {
    if (st.screen !== "lesson" || st.phase === "check") return;

  function hideRes() {

  function endScan() {
    clear("steps"); clear("ck2"); clear("ck3");

  }
  function tick(n, state) { var el = $("ck" + n); if (el) { el.className = state; el.firstChild.textContent = state === "ok" ? "✓" : ""; } }
  // Ticks follow the grader's real steps (GET /live/state agent_steps: observe → evaluate → decide);
  // timers only fill in if the backend doesn't report steps.
  function watchSteps() {
    var seen = null, t0 = Date.now(), got = { observe: false, evaluate: false, decide: false };

  function graded(r) {
    if (st.phase !== "check") return;

  // the score counts up inside a ring that fills and changes colour as it goes; then confetti or the fix
  function showDial(score, line, fix, party) {

      "<div class='num' id='dialNum'>0</div><div class='of'>out of 100</div></div>" +

  }

  function gradeError(msg) {

    clear("gradeTimeout");
    st.phase = "result";

    $("res").innerHTML = "<div class='line'>" + esc(msg) + "</div>";

    report();
  }

  function nextChar() {

  function nextWord() {

    }
    if (st.from === "compose" || st.from === "name") { say("All written. Nice work."); back(); return; }
    var i = st.itemIdx + 1;
    if (i >= st.items.length) { say("You finished every " + langName(st.lang) + " word!"); go("words", { lang: st.lang }, true); return; }

  }
  function openLesson(lang, itemId, charIdx) {

    var tries = 0;
    (function attempt() {
      postJSON("/session", { lang: lang, item_id: itemId, char_index: charIdx, mode: "write" }).then(function (s) {

      }).catch(function (e) {

  }
  function clearLessonTimers() {

  function leaveLesson() { if (st.screen === "lesson") { clearLessonTimers(); if (ink) ink.stop(); st.phase = null; } }
  function meaning() {

    if (st.screen === "lesson" && s) { say(s.text + " means " + s.meaning + "."); if (s.audio_url) later("meanAudio", 1800, function () { N.play(s.audio_url); }); toast("“" + s.meaning + "” · " + (s.romanization || ""), 3500); return; }

  }

  // ------------------------------------------------------------------ starting things
  function startLang(lang) { st.lang = lang; go("words", { lang: lang }); }
  function startItem(lang, itemId, charIdx, from) { st.from = from || "learn"; st.lang = lang; go("lesson", { lang: lang, item_id: itemId, char_index: charIdx || 0, from: from || "learn" }); }
  function startHere() {

      case "learn": startLang(LANGS[st.sel]); return;
      case "words": var p = st.items[st.sel]; if (p) { st.itemIdx = st.sel; startItem(st.lang, p.id, 0, "learn"); } return;

  function composeLesson(lang, text, from) {

  // ------------------------------------------------------------------ commands
  function doLesson(intent) {

      case "show_again": watch(true); return true;
      case "again": if (st.phase === "result") { watch(true); return true; } watch(true); return true;
      case "faster": st.speed = Math.max(0.5, st.speed / 1.4); toast("Faster", 1200); say("Faster."); if (st.phase === "your_turn") showStroke("voice"); return true;
      case "slower": st.speed = Math.min(2.5, st.speed * 1.4); toast("Slower", 1200); say("Slower."); if (st.phase === "your_turn") showStroke("voice"); else watch(true); return true;
      case "repeat": if (st.session && st.session.audio_url) N.play(st.session.audio_url); say(hint.replace(/[“”]/g, "")); return true;
      case "check": check(); return true;
      case "skip": nextChar(); return true;
    }
    return false;
  }

  var INTENT_ALIAS = { retry: "again", word: "select", practice: "select" };
  function act(intent, args, nav) {
    args = args || {};

    if (intent === "learn" && !args.lang && args.language) args.lang = args.language;
    if ((intent === "compose" || intent === "write_name") && !args.lang && args.language) args.lang = args.language;
    if (intent === "open" && !args.screen && args.target) args.screen = args.target;

        if (r && !args.session) { postJSON("/session", { lang: cl, mode: "compose", text: args.text, char_index: 0 }).then(function (s) { if (st.compose) st.compose.session = s; }).catch(function () {}); }
        return;

    }
    if (st.screen === "name" && args.lang) { pickNameLang(args.lang); return; }

  // ------------------------------------------------------------------ on-device matcher (fallback when /voice has no intent)
  var LANG_WORDS = [

  function findLang(t) { for (var i = 0; i < LANG_WORDS.length; i++) if (LANG_WORDS[i][1].test(t)) return LANG_WORDS[i][0]; return null; }
  function match(raw) {
    var t = (" " + String(raw || "").toLowerCase().replace(/[^\w\s']/g, " ").replace(/\s+/g, " ") + " ");
    t = t.replace(/^ (?:hey |hi |ok |okay )?(?:scribi|scribby|scribe|scribbie|scruby) /, " ");
    var m;
    if ((m = t.match(/(?:how (?:do|would|can|should) (?:i|you|we) (?:write|say|spell)|help me write|write|translate) (.+?) (?:in|into) (\w+)/))) {
      var cl = findLang(m[2]); if (cl) return { intent: "compose", args: { text: m[1].trim(), lang: cl } };
    }

      var nm = m[1].trim().split(" ").slice(0, 3).join(" ");
      if (!/^(done|finished|ready)\b/.test(nm)) return { intent: "write_name", args: { name: nm.replace(/\b\w/g, function (c) { return c.toUpperCase(); }) } };
    }
    if (/\b(exit|goodbye|good bye|bye scribi|go to sleep|stop listening|that's all|close (the )?app|i'm finished for today)\b/.test(t)) return { intent: "exit" };
    if (/\b(what can i say|help|commands|how (do i|to) use)\b/.test(t)) return { intent: "help" };
    if (/\b(home|main menu|start over)\b/.test(t)) return { intent: "home" };
    if (/\b(go back|back)\b/.test(t) && !/again/.test(t)) return { intent: "back" };

    if (/\b(previous|go back one|last one|before)\b/.test(t)) return { intent: "previous" };
    if (/\b(next|continue|go on|ready|move on|keep going)\b/.test(t)) return { intent: "next" };
    if (/\b(daily|review|daily five|daily 5)\b/.test(t)) return { intent: "open", args: { screen: "daily5" } };
    if (/\b(journal|my pages|history)\b/.test(t)) return { intent: "open", args: { screen: "journal" } };
    if (/\b(write my name|my name|name)\b/.test(t)) return { intent: "write_name" };
    if (/\b(help me write|compose|message)\b/.test(t)) return { intent: "compose" };
    var lang = findLang(t);
    if (lang) return { intent: st.screen === "name" ? "select" : "learn", args: { lang: lang } };
    if (/\b(learn|lessons?|languages?)\b/.test(t)) return { intent: "open", args: { screen: "learn" } };
    if ((m = t.match(/\b(?:number|option|item|no) (\w+)\b/)) || (m = t.match(/^ (one|two|three|four|five|six|first|second|third|fourth|fifth|sixth|\d) $/))) {
      var n = NUMS[m[1]] || parseInt(m[1], 10); if (n) return { intent: "select", args: { n: n } };
    }
    if (st.screen === "words") {
      for (var i = 0; i < st.items.length; i++) {
        var it = st.items[i]; var mean = (it.meaning || "").toLowerCase();
        if (mean && t.indexOf(" " + mean + " ") >= 0 || t.indexOf(" " + it.id.replace(/_/g, " ") + " ") >= 0) return { intent: "select", args: { item_id: it.id, lang: st.lang } };
      }
    }
    if (/\b(start|open|okay|ok|yes|go|select|that one|this one|begin|let's go)\b/.test(t)) return { intent: "start" };
    return { intent: "unknown" };
  }

  // ------------------------------------------------------------------ voice replies
  // ---- tool replies (A's NLU): actions run in order, then nav/session reconcile, then `say` once
  var TOOL_ALIAS = {
    go_home: "home", home: "home", go_back: "back", back: "back", exit_app: "exit", exit: "exit", sleep: "exit", goodbye: "exit",
    wake: "wake", open_screen: "open", open: "open", navigate: "open", learn_language: "learn", learn: "learn", choose_language: "learn",
    open_word: "select", select_word: "select", select: "select", practice: "select", open_lesson: "select", pick: "pick",
    start: "start", start_writing: "start", next: "next", next_stroke: "next", previous: "previous", previous_stroke: "previous",
    prev: "previous", show_again: "show_again", replay: "show_again", repeat: "repeat", play_audio: "play_audio", pronounce: "play_audio",
    slower: "slower", faster: "faster", check: "check", grade: "check", retry: "again", again: "again", skip: "skip",
    next_word: "skip", meaning: "meaning", explain: "meaning", spell_word: "compose", compose: "compose", translate: "compose",
    how_write: "compose", write_name: "write_name", spell_name: "write_name", say: "say", speak: "say", show_text: "show_text",
    toast: "show_text", set_phase: "set_phase", help: "help", open_daily: "daily5", daily5: "daily5", open_journal: "journal", journal: "journal"
  };
  function waitIdle(maxMs) {
    var t0 = Date.now();
    return new Promise(function (res) {
      (function poll() {
        var busy = st.loading || (st.screen === "compose" && st.compose && !st.compose.result && !st.compose.failed) ||
          (st.screen === "name" && st.name && !st.nameResult);
        if (!busy || Date.now() - t0 > (maxMs || 8000)) res(); else setTimeout(poll, 120);
      })();
    });
  }
  function setPhase(ph) {
    if (st.screen !== "lesson" || !st.session) return;
    if (ph === "watch") watch(true); else if (ph === "your_turn" || ph === "write") yourTurn();
    else if (ph === "check") check(); else if (ph === "result" && st.phase !== "result") check();
  }
  function runTool(name, a) {
    a = a || {};
    var t = TOOL_ALIAS[name] || name;
    console.log("tool " + name + " " + JSON.stringify(a));
    switch (t) {
      case "exit": sleepNow(a.say || a.text); return;
      case "wake": if (st.screen === "idle") wake(true); return;
      case "say": if (a.text) say(a.text); return;
      case "show_text": if (a.text) toast(a.text, a.ms || 3000); return;
      case "set_phase": setPhase(a.phase); return;
      case "play_audio": if (a.url) N.play(a.url); else if (st.session && st.session.audio_url) N.play(st.session.audio_url); return;
      case "daily5": case "journal": go(t); return;
      case "open": if (a.screen === "idle") { sleepNow(); return; } act("open", a); return;
      case "compose": act("compose", { text: a.text || a.word, lang: a.lang || a.language, result: a.result, session: a.session }); return;
      case "pick": act("pick", { ordinal: a.ordinal || a.n }); return;
      case "home": go("home", { quiet: true }); return;
    }
    act(t, a);
  }
  function sameAsNow(nav) {
    if (!nav || !nav.screen) return true;
    var sc = SCREEN_ALIAS[nav.screen] || nav.screen;
    if (sc !== st.screen) return false;
    if (sc === "words") return !nav.lang || nav.lang === st.lang;
    if (sc === "lesson") { var s = st.session || {}; return (!nav.item_id || nav.item_id === s.item_id) && (nav.char_index == null || nav.char_index === st.charIdx) && (!nav.lang || nav.lang === s.lang); }
    return true;
  }
  function applyNav(nav, session) {
    if (!nav || !nav.screen) return;
    var sc = SCREEN_ALIAS[nav.screen] || nav.screen;
    if (!sameAsNow(nav)) {
      if (sc === "idle") { sleepNow(); return; }
      if (sc === "lesson") {
        if (st.screen !== "lesson") st.from = { daily5: "daily5", compose: "compose", name: "name" }[st.screen] || st.from || "learn";
        if (session) { st.lang = session.lang; if (st.screen === "lesson") { st.inkFor = null; clearLessonTimers(); hideRes(); startSession(session); } else go("lesson", { session: session, from: st.from }); }
        else if (nav.item_id) { if (st.screen === "lesson") openLesson(nav.lang || st.lang, nav.item_id, nav.char_index || 0); else startItem(nav.lang || st.lang, nav.item_id, nav.char_index || 0, st.from); }
      } else if (sc === "words") startLang(nav.lang || st.lang);
      else go(sc, { lang: nav.lang });
    }
    if (nav.phase && sc === "lesson") waitIdle().then(function () { if (st.phase !== nav.phase) setPhase(nav.phase); });
  }
  function speakReply(r) {
    if (r.say_url) N.play(r.say_url); else if (r.say) N.speak(r.say);
  }
  function applyReply(r, heard) {
    var acts = r.actions || r.tools || r.steps || r.tool_calls || [];
    if (!Array.isArray(acts)) acts = [acts];
    acts = acts.map(function (x) { return typeof x === "string" ? { tool: x, args: {} } : { tool: x.tool || x.name || x.action || x.type, args: x.args || x.arguments || x.input || {} }; })
      .filter(function (x) { return x.tool; });
    var hasSay = !!(r.say || r.say_url);
    if (hasSay) { holdSay++; heldLines = []; }
    event("voice", { heard: heard, intent: r.intent, tools: acts.map(function (x) { return x.tool; }), nav: r.nav || null, screen: st.screen, source: "glasses" });
    var chain = Promise.resolve();
    acts.forEach(function (x) { chain = chain.then(function () { runTool(x.tool, x.args); return waitIdle(); }); });
    return chain.then(function () {
      applyNav(r.nav, r.session);
      return waitIdle(1500);
    }).catch(function (e) { console.log("apply error " + e); }).then(function () {
      if (hasSay) { holdSay = Math.max(0, holdSay - 1); heldLines = []; speakReply(r); }
      report();
    });
  }

  function handleVoice(r) {
    var heard = r.heard || r.text || "";
    if (st.screen !== "idle") showHeard(heard);
    if (!heard && !r.intent && !r.actions && !r.tools && !r.steps) { setMic("listening"); return; }
    // Idle: only "Hey Scribi" (or the backend's wake) gets through; everything else is ignored silently.
    if (st.screen === "idle") {
      var toolsIn = (r.actions || r.tools || r.steps || []).map(function (x) { return typeof x === "string" ? x : (x.tool || x.name || ""); });
      var woke = WAKE.test(heard) || r.intent === "wake" || toolsIn.indexOf("wake") >= 0;
      if (!woke) { console.log("idle, ignored: " + heard); return; }
      var rest = heard.replace(WAKE, "").replace(/^[\s,.!]+|[\s,.!?]+$/g, "");
      var real = toolsIn.filter(function (t) { return t && t !== "wake"; }).length || (r.intent && r.intent !== "wake" && r.intent !== "unknown");
      showHeard(heard);
      wake(!!(rest && real));
      if (!(rest && real)) return;
    }
    if (r.actions || r.tools || r.steps || r.tool_calls) {
      console.log("voice heard=" + JSON.stringify(heard) + " -> tools " + JSON.stringify(r.actions || r.tools || r.steps || r.tool_calls) + " nav " + JSON.stringify(r.nav));
      applyReply(r, heard);
      return;
    }
    var intent = r.intent, args = r.args || {};
    // trust the backend's intent, but fill gaps with ours (and our list context)
    var mine = match(heard);
    // The backend's matcher knows chatter from commands; ours only fills in when it gave no intent at all
    // (backend down / old build), or for typed test phrases.
    if (!intent || (intent === "unknown" && r.typed && !(r.args && r.args.reason))) { intent = mine.intent; args = mine.args || {}; }
    else if (intent === "select" && !args.item_id && !args.lang && mine.args) args = mine.args;
    event("voice", { heard: heard, intent: intent, args: args, screen: st.screen, source: "glasses" });
    console.log("voice heard=" + JSON.stringify(heard) + " -> " + intent + " " + JSON.stringify(args) + " on " + st.screen + " sel=" + st.sel);
    if (intent === "exit") { sleepNow(r.say); return; }
    if (intent === "wake") { if (st.screen === "idle") wake(); return; }
    if (intent === "unknown") {
      // From the open mic this is often someone nearby: only a quiet nudge, never a spoken one.
      if (r.typed) say(r.say || ("Try saying: " + hint.replace(/^Say /, "").replace(/[“”]/g, "")));
      toast("Try: " + hint.replace(/^Say /, ""), 2600);
      return;
    }
    var nav = r.nav;
    // when the backend already started a lesson session for us, use it directly
    if (nav && nav.screen === "lesson" && r.session) { applyReply({ nav: nav, session: r.session, say: r.say, say_url: r.say_url }, heard); return; }
    // legacy single intent: run it as one tool, then reconcile with nav and speak the backend's line once
    applyReply({ actions: [{ tool: intent, args: args }], nav: nav, session: r.session, say: r.say, say_url: r.say_url }, heard);
  }

  // ------------------------------------------------------------------ native → page
  window.worn = {
    mic: function (s) { setMic(s === "off" ? "off" : s); },
    voice: function (json) {
      voiceDown = false;
      var r; try { r = typeof json === "string" ? JSON.parse(json) : json; } catch (e) { return; }
      setMic("listening");
      handleVoice(r);
    },
    voiceError: function (code) {
      setMic("listening");
      if (code === 404 || code === 0) { var first = !voiceDown; voiceDown = true; setMic("listening"); if (first) toast("Voice is reconnecting…", 2000); }
      else toast("I didn't catch that.", 1600);
    },
    heard: function (text) {
      // test hook (adb --es say "…"): through /voice with text, else our matcher
      var fd = new FormData(); fd.append("text", text); fd.append("screen", st.screen);
      setMic("thinking");
      fetch("/voice", { method: "POST", body: fd }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (r) { setMic("listening"); r.heard = r.heard || text; r.typed = true; handleVoice(r); })
        .catch(function () { setMic("listening"); handleVoice({ heard: text, typed: true }); });
    },
    key: function (k) {
      if (st.screen === "idle") { wake(); return; }
      if (k === "tap") { if (st.screen === "lesson") doLesson(st.phase === "your_turn" && st.stroke >= st.strokeCount ? "check" : "next"); else startHere(); }
      else if (k === "double") back();
      else if (k === "long") { if (st.screen === "lesson") doLesson("check"); else go("howto"); }
      else if (k === "left") act("previous"); else if (k === "right") act("next");
    },
    ink: function (frac, ms) {
      if (st.screen !== "lesson" || st.phase !== "your_turn" || st.stroke >= st.strokeCount) return;
      event("ink", { tier1_ms: ms, frac: frac, source: "glasses" });
      nextStroke("ink");
    },
    audioDone: function () { if (micState === "speaking") setMic("listening"); },
    captured: function () { if (st.phase === "check") { tick(1, "ok"); tick(2, "on"); } },
    strokeScore: function (idx, json) {
      if (st.screen !== "lesson" || !st.strokeScores) return;
      var v = null;
      try { var r = typeof json === "string" ? JSON.parse(json) : json; if (r && r.score != null) v = Math.max(0, Math.min(100, Math.round(r.score))); } catch (e) {}
      st.strokeScores[idx] = v;
      updateRing(); popScore(v);
      event("stroke_match", { stroke: idx, score: v, source: "glasses" });
    },
    graded: function (json) { var r; try { r = typeof json === "string" ? JSON.parse(json) : json; } catch (e) { r = {}; } graded(r); },
    error: function (msg) { if (st.phase === "check") gradeError(msg || "I couldn't check that. Say check to try again."); else toast(msg, 2500); },
    test: function (what) {   // adb --es js "worn.test(1)": 1 = pass, 0 = fail (forces a result while checking)
      st.phase = "check";
      graded(what ? { correct: true, score: 94, reaction: "Nailed it!" } : { correct: false, score: 41, reaction: "So close!", feedback: "The second stroke should start higher." });
    },
    testStrokes: function () {   // debug: adb --es js "worn.testStrokes()" (sample scores, to see the ring)
      if (st.phase !== "your_turn") return;
      [87, 62, 41].forEach(function (v, i) { setTimeout(function () { st.strokeScores[i] = v; updateRing(); popScore(v); st.stroke = i + 1; showStroke("voice"); }, i * 900); });
    },
    state: function () { return JSON.stringify({ screen: st.screen, phase: st.phase, stroke: st.stroke, strokeCount: st.strokeCount, lang: st.lang, sel: st.sel }); },
    go: go
  };

  // ------------------------------------------------------------------ boot
  (function splash() {
    var el = $("splash"); if (!el) return;
    el.innerHTML = MARK + "<span>Scribi</span>";
    setTimeout(function () { el.className = "out"; }, 2700);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 3500);
  })();
  if (window.WornSfx) WornSfx.init("");
  getJSON("/content").then(function (c) {
    (c.langs || []).forEach(function (l) { content[l.lang] = l; });
  }).catch(function () {}).then(function () {
    go("home", { greet: "Hi, I'm Scribi. Say learn Greek, or say help." }, true);
    N.ready();
  });
})();
</script>
</body>
</html>
