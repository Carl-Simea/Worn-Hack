[project]
name = "worn-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "opencv-contrib-python-headless>=5.1.0.95",
    "numpy>=2.5.5",
    "regex>=2026.11.19",
    "pypinyin>=0.55.0",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
