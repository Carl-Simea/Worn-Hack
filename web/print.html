<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worn Worksheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1a17'/%3E%3Cpath d='M14 22c6 18 9 24 12 24s5-14 6-14 3 14 6 14 6-8 12-24' fill='none' stroke='%23f6f2ea' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400&family=Noto+Sans+Devanagari:wght@400&family=Noto+Sans+Arabic:wght@400&family=Noto+Sans+Hebrew:wght@400&family=Noto+Sans:wght@400&family=Noto+Serif+SC:wght@500&family=Noto+Serif+Devanagari:wght@500&family=Noto+Naskh+Arabic:wght@500&family=Noto+Serif+Hebrew:wght@500&family=Noto+Serif:wght@500&display=swap">
<link rel="stylesheet" href="/static/web/fonts.css">
<link rel="stylesheet" href="/static/web/worn.css">
<!-- Printable worksheet (owner: agent B). Served at GET /print/{lang}. One row per character: the stroke order
     step by step, a faint model to trace, then empty boxes. Boxes are 30 mm, big enough for the glasses camera
     to read from a normal writing distance. Print at 100% (no "fit to page"). -->
<style>
  :root { color-scheme: light; --box: 30mm; --guide: #d9d1c1; --faint: #cfc6b5; }
  body { background: #e9e4da; color: #1b1a17; }
  .tools { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    padding: 12px 16px; background: rgba(246, 242, 234, .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid #ddd5c6; }
  .tools select { max-width: 44vw; height: 40px; border-radius: 999px; border: 1px solid #d3cab8; padding: 0 14px; background: #fbf8f2; font: 600 14px var(--ui); }
  .tools .hint { font-size: 13px; color: #8f887c; }
  .sheet { width: 210mm; min-height: 297mm; margin: 20px auto; background: #fff; padding: 14mm 14mm 12mm; box-shadow: 0 10px 40px -18px rgba(0,0,0,.35); }
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1.2pt solid #1b1a17; padding-bottom: 4mm; margin-bottom: 5mm; gap: 8mm; }
  .head .wordmark { font-size: 14pt; }
  .head h1 { font-family: var(--display); font-weight: 400; font-size: 26pt; line-height: 1; margin: 1.5mm 0 0; }
  .head .sub { font: 500 8.5pt/1.3 var(--ui); color: #5d5850; margin-top: 1.5mm; max-width: 100mm; }
  .head .who { text-align: right; font: 500 8.5pt/2.2 var(--ui); color: #5d5850; white-space: nowrap; }
  .head .who span { display: inline-block; width: 38mm; border-bottom: .6pt solid #8f887c; margin-left: 2mm; }
  .word { margin: 0 0 5mm; break-inside: avoid; page-break-inside: avoid; }
  .word h2 { display: flex; align-items: baseline; gap: 4mm; margin: 0 0 2.4mm; font-weight: 400; }
  .word h2 .script { font-size: 20pt; line-height: 1.25; }
  .word h2 .rom { font-family: var(--display); font-style: italic; font-size: 13pt; }
  .word h2 .mean { font: 500 9pt var(--ui); color: #5d5850; }
  .word .how { font: 400 8pt/1.35 var(--ui); color: #8f887c; margin: -1mm 0 2mm; }
  .row { display: flex; align-items: flex-start; gap: 2.4mm; margin-bottom: 2.6mm; break-inside: avoid; page-break-inside: avoid; }
  .steps { width: 44mm; flex: none; display: flex; flex-wrap: wrap; gap: 1mm; align-content: flex-start; }
  .steps .st { width: 8.2mm; height: 8.2mm; border: .4pt solid var(--guide); position: relative; }
  .steps .st .ink { position: absolute; inset: 6%; }
  .steps .lbl { font: 600 6.5pt/1.2 var(--ui); color: #8f887c; width: 100%; margin-top: .6mm; }
  .box { width: var(--box); height: var(--box); flex: none; border: .8pt solid #b9ae98; position: relative; }
  .box::before, .box::after { content: ""; position: absolute; }
  .box::before { left: 50%; top: 0; bottom: 0; border-left: .5pt dashed var(--guide); }
  .box::after { top: 50%; left: 0; right: 0; border-top: .5pt dashed var(--guide); }
  .box.diag { background:
      linear-gradient(to top right, transparent calc(50% - .3pt), var(--guide) calc(50% - .3pt), var(--guide) calc(50% + .3pt), transparent calc(50% + .3pt)),
      linear-gradient(to top left, transparent calc(50% - .3pt), var(--guide) calc(50% - .3pt), var(--guide) calc(50% + .3pt), transparent calc(50% + .3pt)); }
  .box .model { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 21mm; line-height: 1; color: var(--faint); z-index: 1; }
  .box .model.solid { color: #1b1a17; }
  .box .model.ghost { color: #ece6da; }
  .box .tag { position: absolute; left: 1mm; top: .6mm; font: 600 5.5pt var(--ui); color: #b5ab97; letter-spacing: .08em; text-transform: uppercase; z-index: 2; }
  .foot { margin-top: 6mm; font: 400 7.5pt/1.4 var(--ui); color: #8f887c; display: flex; justify-content: space-between; gap: 8mm; border-top: .5pt solid #ddd5c6; padding-top: 2.5mm; }
  .sans[data-lang="mandarin"] { font-family: "Noto Sans SC", sans-serif; }
  .sans[data-lang="hindi"] { font-family: "Noto Sans Devanagari", sans-serif; }
  .sans[data-lang="arabic"] { font-family: "Noto Sans Arabic", sans-serif; }
  .sans[data-lang="hebrew"] { font-family: "Noto Sans Hebrew", sans-serif; }
  .sans[data-lang="russian"], .sans[data-lang="greek"] { font-family: "Noto Sans", sans-serif; }
  .box .model.sans[data-lang="hindi"] { font-size: 17mm; }
  .box .model.long { font-size: 9mm; }
  @media (max-width: 230mm) { .sheet { width: auto; min-height: 0; margin: 12px; padding: 18px; overflow: hidden; } .head .who span { width: 24mm; } .row { flex-wrap: wrap; } .steps { width: 100%; } }
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .tools { display: none; }
    .sheet { margin: 0; box-shadow: none; width: 210mm; min-height: 0; padding: 12mm 13mm 10mm; }
    .row { flex-wrap: nowrap; } .steps { width: 44mm; }
    .sheet + .sheet { page-break-before: always; }
  }
</style>
</head>
<body>
<div class="tools">
  <select id="lang" aria-label="Language"></select>
  <select id="item" aria-label="Word"><option value="">All five words</option></select>
  <button class="btn primary" onclick="window.print()">Print</button>
  <span class="hint">A4 or Letter, at 100%. Each box is 3 cm.</span>
</div>
<div id="out"></div>
<script src="/static/web/worn-ink.js"></script>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var API = (qs.get("api") || "").replace(/\/$/, "");
  var $ = function (id) { return document.getElementById(id); };
  var ORDER = ["mandarin", "hindi", "arabic", "russian", "hebrew", "greek"];
  var m = /\/print\/(\w+)/.exec(location.pathname);
  var lang = (m && m[1]) || qs.get("lang") || "mandarin";
  var only = qs.get("item") || "";
  var LANGS = {};
  function esc(t) { return String(t === undefined || t === null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function render() {
    var L = LANGS[lang];
    if (!L) { $("out").innerHTML = '<div class="sheet"><h1 class="display">No lessons for “' + esc(lang) + '”</h1></div>'; return; }
    document.title = "Worn worksheet · " + L.name;
    var items = (L.items || L.phrases || []).filter(function (it) { return !only || it.id === only; });
    var dir = L.rtl ? "rtl" : "ltr";
    // Fill A4 pages by height: ~222 mm of room under the header; a word heading ~14 mm, a row ~33 mm.
    var ROOM = 222, HEAD = 15, ROW = 33, pages = [[]], used = 0, inks = [];
    items.forEach(function (it) {
      var seen = {}, idx = [];
      (it.chars || []).forEach(function (c, ci) { if (!seen[c]) { seen[c] = 1; idx.push(ci); } });
      var part = 0;
      while (idx.length) {
        var head = HEAD + (it.how && !part ? 4 : 0);
        if (used + head + ROW > ROOM && used > 0) { pages.push([]); used = 0; }
        var fit = Math.max(1, Math.floor((ROOM - used - head) / ROW));
        var take = idx.splice(0, fit);
        pages[pages.length - 1].push({ it: it, idx: take, cont: part > 0 });
        used += head + take.length * ROW;
        part++;
      }
    });
    $("out").innerHTML = pages.map(function (pg, pi) {
      return '<section class="sheet">' +
        '<div class="head"><div><span class="wordmark">Worn</span><h1>' + esc(L.name) + '</h1><div class="sub">' + esc(L.script || "") +
        (L.rtl ? " · written right to left" : "") + ". Watch the steps, trace the grey model, then write it on your own. Keep the page flat and well lit for the glasses camera.</div></div>" +
        '<div class="who">Name<span></span><br>Date<span></span></div></div>' +
        pg.map(function (blk) {
          var it = blk.it, info = it.char_info || [];
          return '<div class="word"><h2><span class="script" data-lang="' + lang + '" dir="' + dir + '">' + esc(it.text) + '</span><span class="rom">' + esc(it.romanization || "") +
            '</span><span class="mean">“' + esc(it.meaning || "") + '”' + (blk.cont ? " · continued" : "") + "</span></h2>" + (it.how && !blk.cont ? '<div class="how">' + esc(it.how) + "</div>" : "") +
            blk.idx.map(function (ci) {
              var c = it.chars[ci];
              var ci2 = info[ci] || {}, n = ci2.stroke_count || 0, url = ci2.stroke_url || null;
              var long = Array.from(c).length > 2 && L.rtl;
              var stepIds = [];
              var steps = url && n > 1 ? Array.apply(null, Array(Math.min(n, 15))).map(function (_, k) {
                var id = "st" + inks.length; inks.push({ id: id, lang: lang, char: c, url: url, k: k + 1, rtl: L.rtl }); stepIds.push(id);
                return '<div class="st"><div class="ink" id="' + id + '"></div></div>';
              }).join("") : "";
              var lbl = url ? (n + (n === 1 ? " stroke" : " strokes") + (L.stroke_order === "true" || lang === "mandarin" ? "" : " · suggested order")) : "trace the shape";
              var cr = it.char_romanization && it.char_romanization[ci] ? " · " + it.char_romanization[ci] : "";
              var model = function (cls, tag) {
                return '<div class="box' + (lang === "mandarin" ? " diag" : "") + '">' + (tag ? '<span class="tag">' + tag + "</span>" : "") +
                  '<div class="model sans ' + cls + (long ? " long" : "") + '" data-lang="' + lang + '" dir="' + dir + '">' + esc(c) + "</div></div>";
              };
              var empty = function () { return '<div class="box' + (lang === "mandarin" ? " diag" : "") + '"></div>'; };
              return '<div class="row" dir="' + dir + '"><div class="steps" dir="ltr">' + steps + '<div class="lbl"><bdi>' + esc(c) + "</bdi> · " + esc(lbl + cr) + "</div></div>" +
                model("solid", "") + model("", "trace") + model("ghost", "") + empty() + "</div>";
            }).join("") + "</div>";
        }).join("") +
        '<div class="foot"><span>Worn · write on paper, the glasses check it</span><span>' + esc(L.name) + " · page " + (pi + 1) + " of " + pages.length + "</span></div></section>";
    }).join("");
    // stroke-by-stroke thumbnails
    inks.forEach(function (x) {
      var ink = WornInk.create($(x.id), { theme: "paper", numbers: false, api: API });
      ink.load({ lang: x.lang, char: x.char, stroke_url: x.url, rtl: x.rtl }).then(function () { ink.upTo(x.k); });
    });
  }

  function selects() {
    $("lang").innerHTML = ORDER.filter(function (l) { return LANGS[l]; }).map(function (l) {
      return '<option value="' + l + '"' + (l === lang ? " selected" : "") + ">" + esc(LANGS[l].name) + "</option>";
    }).join("");
    var L = LANGS[lang];
    $("item").innerHTML = '<option value="">All five words</option>' + ((L && (L.items || L.phrases)) || []).map(function (it) {
      return '<option value="' + esc(it.id) + '"' + (it.id === only ? " selected" : "") + ">" + esc(it.text + " · " + (it.meaning || "")) + "</option>";
    }).join("");
  }
  $("lang").onchange = function () { lang = $("lang").value; only = ""; history.replaceState(null, "", "/print/" + lang); selects(); render(); };
  $("item").onchange = function () { only = $("item").value; history.replaceState(null, "", "/print/" + lang + (only ? "?item=" + only : "")); render(); };

  fetch(API + "/content", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (c) {
    (c.langs || []).forEach(function (l) { LANGS[l.lang] = l; });
    selects(); render();
  }).catch(function () { $("out").innerHTML = '<div class="sheet"><h1 class="display">Can’t reach the Worn server</h1></div>'; });
})();
</script>
</body>
</html>
