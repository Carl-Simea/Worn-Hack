<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
<title>Worn Journal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1a17'/%3E%3Cpath d='M14 22c6 18 9 24 12 24s5-14 6-14 3 14 6 14 6-8 12-24' fill='none' stroke='%23f6f2ea' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Noto+Serif+SC:wght@500&family=Noto+Serif+Devanagari:wght@500&family=Noto+Naskh+Arabic:wght@500&family=Noto+Serif+Hebrew:wght@500&family=Noto+Serif:wght@500&display=swap">
<link rel="stylesheet" href="/static/web/worn.css">
<!-- Handwriting journal (owner: agent B). Served at GET /app/journal. Every photo the glasses (or phone) took,
     grouped by character: first attempt next to the latest, with every try in between. Data: GET /journal. -->
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 max(18px, env(safe-area-inset-right)) 70px max(18px, env(safe-area-inset-left)); }
  .top { display: flex; align-items: center; justify-content: space-between; height: 60px; padding-top: env(safe-area-inset-top); }
  .top .wordmark { font-size: 28px; text-decoration: none; }
  h1.display { font-size: clamp(42px, 6vw, 72px); margin: 18px 0 8px; }
  .lede { color: var(--ink-2); font-size: clamp(17px, 1.6vw, 20px); max-width: 34em; margin: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin: 26px 0 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { cursor: pointer; height: 36px; font-size: 14px; }
  .stats { display: flex; gap: 22px; }
  .stat b { display: block; font-family: var(--display); font-size: 34px; line-height: 1; font-weight: 400; }
  .stat span { font: 600 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .list { display: grid; gap: 16px; }
  .entry { padding: 20px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 22px; align-items: start; animation: wfade .45s var(--ease) both; }
  .who .c { font-size: 84px; line-height: 1.15; }
  .who .l { font: 600 15px/1.3 var(--ui); margin-top: 4px; }
  .who .m { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }
  .entry > div { min-width: 0; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); align-items: center; gap: 8px; }
  .shot { position: relative; }
  .shot .img { aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--rule); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .cap { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 13px; color: var(--ink-2); gap: 8px; }
  .shot .cap b { font: 600 11px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  .score { font-family: var(--display); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .score.ok { color: var(--accent); }
  .arrow { text-align: center; color: var(--ink-3); font-size: 22px; }
  .gain { display: inline-block; margin-top: 2px; font: 700 12px/1 var(--ui); color: var(--accent); background: var(--accent-soft); padding: 5px 7px; border-radius: 6px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; scrollbar-width: thin; }
  .strip .t { flex: none; width: 74px; text-align: center; font: 600 11px/1.3 var(--ui); color: var(--ink-3); }
  .strip .t div { width: 74px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--rule); margin-bottom: 4px; }
  .strip .t img { width: 100%; height: 100%; object-fit: cover; }
  .strip .t.ok div { border-color: var(--accent); }
  .single .pair { grid-template-columns: minmax(0, 1fr); max-width: 420px; }
  .empty { text-align: center; padding: 70px 20px; }
  .empty .script { font-size: 64px; color: var(--ink-ghost); letter-spacing: .1em; }
  .noimg { display: grid; place-items: center; height: 100%; color: var(--ink-3); font-size: 13px; }
  @media (max-width: 760px) {
    .entry { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .who { display: flex; align-items: center; gap: 16px; }
    .who .c { font-size: 60px; }
    .pair { grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr); }
    .stats { gap: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="wordmark" href="/app">Worn</a><a class="btn ghost" href="/app">← Back to practice</a></div>
  <h1 class="display">Your handwriting</h1>
  <p class="lede">Every character you wrote, photographed by the glasses. Your first try sits next to your latest.</p>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="stats"><div class="stat"><b id="sPhotos">–</b><span>photos</span></div><div class="stat"><b id="sChars">–</b><span>characters</span></div><div class="stat"><b id="sAcc">–</b><span>correct</span></div></div>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var API = (qs.get("api") || "").replace(/\/$/, "");
  var $ = function (id) { return document.getElementById(id); };
  var ORDER = ["mandarin", "hindi", "arabic", "russian", "hebrew", "greek"];
  var LANGS = {}, filter = qs.get("lang") || "";
  function esc(t) { return String(t === undefined || t === null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function url(p) { return !p ? p : /^(https?:|data:)/.test(p) ? p : API + p; }
  function getJSON(p) { return fetch(url(p), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function day(ts) {
    var d = new Date(ts * 1000), now = new Date();
    var diff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
    if (diff === 0) return "Today " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function rtl(l) { return LANGS[l] && LANGS[l].rtl; }
  function shot(e, label) {
    var img = e.image_url ? '<img loading="lazy" alt="Handwritten ' + esc(e.char) + '" src="' + esc(url(e.image_url)) + '">' : '<div class="noimg">no photo</div>';
    return '<div class="shot"><div class="img">' + img + '</div><div class="cap"><span><b>' + label + "</b><br>" + day(e.ts) + '</span><span class="score' + (e.correct ? " ok" : "") + '">' + esc(e.score) + "</span></div></div>";
  }

  function chips() {
    var box = $("chips"), all = [""].concat(ORDER.filter(function (l) { return LANGS[l]; }));
    box.innerHTML = "";
    all.forEach(function (l) {
      var b = document.createElement("button");
      b.className = "chip" + (l === filter ? " on" : "");
      b.textContent = l ? LANGS[l].name : "All scripts";
      b.onclick = function () { filter = l; history.replaceState(null, "", l ? "?lang=" + l : location.pathname); chips(); load(); };
      box.appendChild(b);
    });
  }

  function load() {
    getJSON("/journal" + (filter ? "?lang=" + filter : "")).then(function (j) {
      var es = (j.entries || []).slice().sort(function (a, b) { return a.ts - b.ts; });
      var groups = {}, order = [];
      es.forEach(function (e) {
        var k = e.lang + ":" + e.char;
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(e);
      });
      order.sort(function (a, b) { return groups[b][groups[b].length - 1].ts - groups[a][groups[a].length - 1].ts; });
      $("sPhotos").textContent = es.length;
      $("sChars").textContent = order.length;
      $("sAcc").textContent = es.length ? Math.round(100 * es.filter(function (e) { return e.correct; }).length / es.length) + "%" : "–";
      var list = $("list");
      if (!order.length) {
        list.innerHTML = '<div class="card empty"><div class="script">你 न ب д ש λ</div><h2 class="display" style="font-size:34px;margin:14px 0 6px">No handwriting yet</h2>' +
          '<p class="muted">Write your first character and its photo lands here.</p><a class="btn primary" href="/app">Start writing</a></div>';
        return;
      }
      list.innerHTML = order.map(function (k, idx) {
        var g = groups[k], first = g[0], latest = g[g.length - 1], l = first.lang;
        var best = Math.max.apply(null, g.map(function (e) { return e.score || 0; }));
        var gain = g.length > 1 ? (latest.score || 0) - (first.score || 0) : 0;
        var meta = (LANGS[l] ? LANGS[l].name : l) + "";
        var strip = g.length > 2 ? '<div class="strip">' + g.map(function (e, i) {
          return '<div class="t' + (e.correct ? " ok" : "") + '"><div>' + (e.image_url ? '<img loading="lazy" alt="" src="' + esc(url(e.image_url)) + '">' : "") + "</div>" + esc(e.score) + "</div>";
        }).join("") + "</div>" : "";
        return '<article class="card entry' + (g.length === 1 ? " single" : "") + '" style="animation-delay:' + Math.min(idx, 8) * 40 + 'ms" data-lang="' + esc(l) + '">' +
          '<div class="who"><div class="c script" dir="' + (rtl(l) ? "rtl" : "ltr") + '">' + esc(first.char) + "</div><div><div class=\"l\">" + esc(meta) + "</div>" +
          '<div class="m">' + g.length + (g.length === 1 ? " try" : " tries") + " · best " + best + (gain > 0 ? '<br><span class="gain">+' + gain + " since day one</span>" : "") + "</div></div></div>" +
          "<div>" + (g.length === 1 ? '<div class="pair">' + shot(first, "First try") + "</div>"
            : '<div class="pair">' + shot(first, "Day one") + '<div class="arrow">→</div>' + shot(latest, "Latest") + "</div>") + strip + "</div></article>";
      }).join("");
    }).catch(function () {
      $("list").innerHTML = '<div class="card empty"><h2 class="display" style="font-size:30px">Can’t reach the Worn server</h2><p class="muted">Start the backend on the laptop, then reload.</p></div>';
    });
  }

  getJSON("/content").then(function (c) { (c.langs || []).forEach(function (l) { LANGS[l.lang] = l; }); })
    .catch(function () {}).then(function () { chips(); load(); });
})();
</script>
</body>
</html>
