<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=640,height=480,initial-scale=1,user-scalable=no">
<title>Worn Glasses</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/web/fonts.css">
<!-- The glasses display (owner: agent B). Served at GET /glasses. 640x480, pure black = see-through on the optics.
     Polls GET /live/state every 400 ms (falls back to /session + /session/result) and draws the same WornInk
     strokes as /live. Hooks kept from before: window.WornNative.speak(text); worn.capturing(), worn.graded(json),
     worn.error(msg), worn.replay(). Dev: ?api=http://IP:8000, space = replay, c = confetti test. -->
<style>
  :root { --fg:#fff; --dim:#7f8592; --accent:#9fb0ff; --ok:#7dffb0; --fix:#ffcf6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:640px; height:480px; overflow:hidden; background:#000; color:var(--fg);
    font-family:Inter,"Noto Sans",Roboto,system-ui,sans-serif; }
  .screen { position:absolute; inset:0; opacity:0; transition:opacity .35s; }
  .screen.on { opacity:1; }

  #strip { position:absolute; left:16px; right:16px; top:12px; height:54px; display:flex; justify-content:center; align-items:center;
    font-family:"Noto Sans","Noto Sans SC","Noto Sans Devanagari","Noto Sans Arabic","Noto Sans Hebrew",sans-serif; font-size:36px; white-space:nowrap; }
  #strip span { color:#4a4f5a; margin:0 4px; padding-bottom:2px; border-bottom:3px solid transparent; }
  #strip span.done { color:#d8dbe2; }
  #strip span.cur { color:var(--accent); border-bottom-color:var(--accent); }

  #board { position:absolute; left:18px; top:76px; width:340px; height:340px; }
  #board::before, #board::after { content:""; position:absolute; background:#1b1e25; }
  #board::before { left:50%; top:0; bottom:0; width:1px; }
  #board::after { top:50%; left:0; right:0; height:1px; }
  #ink { position:absolute; inset:14px; }
  #strokeNo { position:absolute; left:18px; top:428px; width:340px; text-align:center; font-size:22px; font-weight:600; color:var(--accent); }

  #side { position:absolute; left:378px; top:84px; width:246px; height:340px; }
  #rom { font-size:36px; font-weight:700; color:var(--accent); line-height:1.1; word-wrap:break-word; }
  #meaning { font-size:24px; margin-top:10px; }
  #lang { font-size:16px; margin-top:12px; color:var(--dim); text-transform:uppercase; letter-spacing:2px; }
  #prompt { position:absolute; bottom:0; left:0; right:0; font-size:21px; line-height:1.35; color:#d8dbe2; }
  #prompt b { color:var(--accent); font-weight:700; }
  #counter { position:absolute; right:18px; top:432px; font-size:18px; color:var(--dim); }

  #result { position:absolute; inset:0; background:#000; text-align:center; opacity:0; pointer-events:none; transition:opacity .3s; }
  #result.on { opacity:1; }
  #resIcon { width:170px; height:170px; margin:52px auto 0; }
  #resIcon circle { fill:none; stroke-width:8; }
  #resIcon path { fill:none; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:120; stroke-dashoffset:120; }
  #result.on #resIcon path { animation:draw .5s .15s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  #result.ok circle, #result.ok path { stroke:var(--ok); }
  #result.fix circle, #result.fix path { stroke:var(--fix); }
  #result.busy circle { stroke:var(--accent); stroke-dasharray:60 500; animation:spin 1s linear infinite; transform-origin:50% 50%; }
  #result.busy path { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #resScore { font-size:26px; font-weight:700; margin-top:10px; color:var(--fg); font-variant-numeric:tabular-nums; }
  #resText { font-size:30px; line-height:1.25; margin:10px 34px 0; }
  #resLine { font-size:20px; color:var(--dim); margin-top:10px; }

  #idle { text-align:center; }
  #idle h1 { font-family:Newsreader,Georgia,serif; font-style:italic; font-weight:500; font-size:84px; margin-top:150px; }
  #idle p { font-size:24px; color:var(--dim); margin-top:10px; }
  #net { position:absolute; right:10px; top:6px; font-size:13px; color:#ff7b6b; display:none; }
</style>
</head>
<body>
<div id="idle" class="screen on"><h1>Worn</h1><p>Pick a phrase on your phone</p></div>

<div id="write" class="screen">
  <div id="strip"></div>
  <div id="board"><div id="ink"></div></div>
  <div id="strokeNo"></div>
  <div id="side">
    <div id="rom"></div>
    <div id="meaning"></div>
    <div id="lang"></div>
    <div id="prompt">Write it on paper.<br>I'll follow your pen.</div>
  </div>
  <div id="counter"></div>
</div>

<div id="result"><svg id="resIcon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path id="resPath" d="M30 52l13 13 27-30"/></svg>
  <div id="resScore"></div><div id="resText"></div><div id="resLine"></div></div>
<div id="net">no server</div>
<audio id="say" preload="auto"></audio>

<script src="/static/web/worn-ink.js"></script>
<script src="/static/web/worn-confetti.js"></script>
<script src="/static/web/worn-sfx.js"></script>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var API = (qs.get("api") || "").replace(/\/$/, "");
  var POLL_MS = 400, RESULT_HOLD_MS = 3800;
  var $ = function (id) { return document.getElementById(id); };
  var ink = WornInk.create($("ink"), { theme: "glasses", label: $("strokeNo"), api: API });
  if (window.WornSfx) WornSfx.init(API);
  var session = null, lessonKey = "", inkReady = false, useLive = true, lastResultTs = null, firstPoll = true;
  var resultTimer = null, lastSync = "", chars = {};

  function url(p) { return !p ? null : /^https?:/.test(p) ? p : API + p; }
  function getJSON(p) {
    return fetch(url(p), { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function show(id) { ["idle", "write"].forEach(function (s) { $(s).classList.toggle("on", s === id); }); }

  // ---- voice + sounds
  function speak(text) {
    try {
      if (window.WornNative && window.WornNative.speak) { window.WornNative.speak(text); return; }
      if (window.speechSynthesis) {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; speechSynthesis.speak(u);
      }
    } catch (e) {}
  }
  var actx = null;
  // Browsers only allow audio after a tap. On the glasses use ?sound=1 (or a native wrapper) to allow it up front.
  var soundForced = qs.get("sound") === "1";
  function soundAllowed() {
    if (soundForced || window.WornNative) return true;
    var ua = navigator.userActivation;
    return !!(ua && ua.hasBeenActive);
  }
  function tone(seq) {
    if (!soundAllowed()) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime + 0.02;
      seq.forEach(function (n) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = n.type || "triangle"; o.frequency.setValueAtTime(n.f, t);
        if (n.to) o.frequency.exponentialRampToValueAtTime(n.to, t + n.d);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(n.v || 0.25, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n.d);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + n.d + 0.02);
        t += n.gap !== undefined ? n.gap : n.d * 0.8;
      });
    } catch (e) {}
  }
  var SOUNDS = {
    cheer: [{ f: 523, d: .12 }, { f: 659, d: .12 }, { f: 784, d: .12 }, { f: 1047, d: .35, type: "square", v: .12 }],
    applause: [{ f: 392, d: .1 }, { f: 523, d: .1 }, { f: 659, d: .1 }, { f: 784, d: .1 }, { f: 1047, d: .3 }],
    drumroll: [{ f: 140, d: .06, type: "square", v: .12, gap: .05 }, { f: 150, d: .06, type: "square", v: .12, gap: .05 },
               { f: 140, d: .06, type: "square", v: .12, gap: .05 }, { f: 150, d: .06, type: "square", v: .12, gap: .05 },
               { f: 880, d: .4, type: "triangle", gap: 0 }],
    boing: [{ f: 180, to: 720, d: .28, type: "sine", v: .3 }],
    encourage: [{ f: 440, to: 330, d: .25, type: "sine", v: .2 }, { f: 392, d: .3, type: "sine", v: .2 }],
    stroke: [{ f: 880, d: .06, type: "sine", v: .08 }]
  };
  // C's recorded sfx first (content/sfx via reactions.json); the synthesized tones are the fallback
  var SFX_OF = { cheer: "cheer", applause: "tada", drumroll: "drumroll", boing: "boing", encourage: "slide", stroke: null };
  function play(name) {
    if (!soundAllowed()) return;
    var f = SFX_OF[name];
    if (f && window.WornSfx) { window.__wornSound = true; WornSfx.play(f); return; }
    if (SOUNDS[name]) tone(SOUNDS[name]);
  }
  function playPronunciation() {
    var a = $("say");
    if (!session || !session.audio_url) return;
    if (a.getAttribute("data-src") !== session.audio_url) { a.src = url(session.audio_url); a.setAttribute("data-src", session.audio_url); }
    try { a.currentTime = 0; } catch (e) {}
    var p = a.play(); if (p && p.catch) p.catch(function () {});
  }

  // ---- lesson
  function renderWrite(s) {
    var strip = $("strip"); strip.innerHTML = "";
    strip.setAttribute("dir", s.rtl ? "rtl" : "ltr");
    var list = (s.item && s.item.chars) || chars[s.lang + "/" + (s.item_id || s.phrase_id)] || [s.char];
    WornInk.segments((s.item && s.item.text) || s.text, list).forEach(function (g) {
      var sp = document.createElement("span");
      if (g.gap) { sp.innerHTML = "&nbsp;"; strip.appendChild(sp); return; }
      var i = g.i; sp.textContent = g.c;
      sp.className = list.length === 1 ? "cur" : i < s.char_index ? "done" : i === s.char_index ? "cur" : "";
      strip.appendChild(sp);
    });
    strip.style.fontSize = (list.length > 7 ? 26 : list.length > 5 ? 30 : 36) + "px";
    $("rom").textContent = s.romanization || "";
    $("meaning").textContent = s.meaning ? "“" + s.meaning + "”" : "";
    $("lang").textContent = s.lang_name || s.lang;
    $("counter").textContent = (s.char_index + 1) + " / " + s.total_chars;
    if (s.show_char === false) $("strip").innerHTML = "<span class='cur'>?</span>";
    show("write");
    inkReady = false; lastSync = "";
    var dictation = s.show_char === false;
    $("board").style.visibility = dictation ? "hidden" : "";
    $("prompt").innerHTML = dictation ? "Listen, then write<br>what you hear." : "Write it on paper.<br>I'll follow your pen.";
    ink.load(s).then(function () { inkReady = true; if (!dictation) ink.loop(); else ink.stop(); });
    playPronunciation();
  }
  function render(s) {
    hideResult();
    session = s;
    if (!s) { ink.stop(); show("idle"); return; }
    renderWrite(s);
  }

  // ---- result overlay
  function hideResult() { clearTimeout(resultTimer); $("result").className = ""; }
  function showResult(r) {
    clearTimeout(resultTimer);
    if (r.ts) lastResultTs = r.ts;
    var el = $("result");
    el.className = "on " + (r.correct ? "ok" : "fix");
    $("resPath").setAttribute("d", r.correct ? "M30 52l13 13 27-30" : "M50 28v28M50 70v1");
    $("resScore").textContent = typeof r.score === "number" ? r.score + " / 100" : "";
    $("resText").textContent = r.feedback || (r.correct ? "Nice!" : "Try again");
    $("resLine").textContent = r.reaction ? (r.emoji ? r.emoji + " " : "") + r.reaction : "";
    speak(r.reaction || r.feedback || (r.correct ? "Nice!" : "Try again"));
    if (window.WornSfx && soundAllowed()) { window.__wornSound = true; WornSfx.forResult(r); }
    else play(r.correct ? "cheer" : "encourage");
    if (r.correct) WornConfetti.burst({ x: .5, y: .35, count: 120, power: .8 });
    resultTimer = setTimeout(hideResult, RESULT_HOLD_MS);
  }
  function showBusy(msg) {
    clearTimeout(resultTimer);
    $("result").className = "on busy";
    $("resScore").textContent = ""; $("resText").textContent = msg || "Checking…"; $("resLine").textContent = "";
    resultTimer = setTimeout(hideResult, 60000);
  }

  // ---- polling
  function state() {
    if (useLive) return getJSON("/live/state").then(function (st) { if (!st) { useLive = false; return state(); } return st; });
    return Promise.all([getJSON("/session"), getJSON("/session/result")]).then(function (a) { return { session: a[0], last_result: a[1], glasses: {} }; });
  }
  function tick() {
    state().then(function (st) {
      $("net").style.display = "none";
      var s = st.session, g = st.glasses || {};
      var key = s ? [s.version, s.lang, s.phrase_id, s.char_index].join("|") : "";
      var fresh = key !== lessonKey;
      if (fresh) { lessonKey = key; render(s); }
      // A's phases: watch (loop the animation) -> write (stroke is 0-based) -> checking -> result
      if (s && inkReady && g.phase) {
        var k = (g.stroke || 0) + "|" + g.phase;
        if (k !== lastSync) {
          var wasWriting = /^\d+\|write/.test(lastSync);
          lastSync = k;
          if (g.phase === "write" || g.phase === "writing") { if (wasWriting) play("stroke"); ink.sync((g.stroke || 0) + 1, "write"); }
          else if (/check|result/.test(g.phase)) ink.sync(999, "result");
          else ink.loop();
        }
      }
      if (/check/.test(g.phase || "") && !$("result").classList.contains("on")) showBusy();
      var r = st.last_result;
      var ts = r ? r.ts : null;
      var mine = r && s && (!r.char || r.char === s.char);
      if (!firstPoll && !fresh && mine && ts && ts !== lastResultTs) showResult(r);
      if (fresh || firstPoll) lastResultTs = ts;
      firstPoll = false;
    }).catch(function () { $("net").style.display = "block"; })
      .then(function () { setTimeout(tick, POLL_MS); });
  }

  // ---- native hooks
  window.worn = {
    capturing: function () { showBusy("Checking…"); },
    graded: function (json) { var r = typeof json === "string" ? JSON.parse(json) : json; if (r.ts && r.ts === lastResultTs) return; showResult(r); },
    error: function (msg) { showResult({ correct: false, feedback: msg || "Couldn't check that, try again", reaction: "boing" }); },
    replay: function () { if (session) render(session); },
    celebrate: function () { play("cheer"); WornConfetti.burst({ x: .5, y: .35, count: 120, power: .8 }); }
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "r") window.worn.replay();
    if (e.key === "c") window.worn.celebrate();
  });

  getJSON("/content").then(function (c) {
    ((c && c.langs) || []).forEach(function (l) { l.phrases.forEach(function (p) { if (p.chars) chars[l.lang + "/" + p.id] = p.chars; }); });
  }).catch(function () {}).then(tick);
})();
</script>
</body>
</html>
