<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worn Stroke Check</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&family=Noto+Serif+Devanagari:wght@500&family=Noto+Naskh+Arabic:wght@500&family=Noto+Serif+Hebrew:wght@500&family=Noto+Serif:wght@500&display=swap">
<link rel="stylesheet" href="/static/web/fonts.css">
<link rel="stylesheet" href="/static/web/worn.css">
<!-- Pre-demo check (owner: agent B). Animates every lesson character in all five scripts with worn-ink.js,
     the renderer /live, /glasses and /app use, and reports which data each one uses. Never touches /session.
     Open /static/web/stroke-test.html. ?lang=hindi shows one language. -->
<style>
  body { padding: 28px clamp(16px, 4vw, 48px) 60px; }
  h1 { font-size: 44px; margin: 0; }
  .sum { margin: 8px 0 22px; color: var(--ink-2); }
  .sum b { color: var(--ink); }
  h2 { font: 600 13px/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 30px 0 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  h2 .script { min-width: 0; overflow-wrap: anywhere; }
  h2 .script { font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 40vw), 1fr)); gap: 14px; }
  .cell { padding: 10px; }
  .cell .box { aspect-ratio: 1; position: relative; border-radius: 12px; }
  .cell .ink { position: absolute; inset: 10%; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; gap: 6px; }
  .meta .script { font-size: 20px; }
  .tag { font: 600 11px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 6px; background: var(--paper-2); color: var(--ink-2); white-space: nowrap; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .lbl { font-size: 12px; color: var(--ink-3); min-height: 1.2em; margin-top: 2px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
</style>
</head>
<body>
<h1 class="display">Stroke check</h1>
<div class="sum" id="sum">Loading lessons…</div>
<div class="bar">
  <button class="btn" id="mode">Show on glasses black</button>
  <a class="btn ghost" href="/live">Open /live</a>
</div>
<div id="out"></div>
<script src="/static/web/worn-ink.js"></script>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var API = (qs.get("api") || "").replace(/\/$/, "");
  var only = qs.get("lang");
  var dark = qs.get("glasses") === "1";
  var LABEL = { hanzi: ["true order", "ok"], pen: ["suggested order", "ok"], worn: ["stroke paths", "ok"], glyph: ["font trace", "warn"] };
  document.getElementById("mode").textContent = dark ? "Show on paper" : "Show on glasses black";
  document.getElementById("mode").onclick = function () { qs.set("glasses", dark ? "0" : "1"); location.search = qs.toString(); };

  function strokeUrl(l, p, ch, i) {
    var lang = l.lang;
    if (p.strokes && p.strokes[i]) return p.strokes[i];
    if (p.stroke_urls && p.stroke_urls[i]) return p.stroke_urls[i];
    if (l.rtl && Array.from(ch).length > 1) return null; // a joined Arabic word: traced from the font
    return "/static/content/strokes/" + lang + "/" + WornInk.hexOf(ch) + (lang === "mandarin" ? ".json" : ".svg");
  }

  fetch(API + "/content", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (c) {
    var out = document.getElementById("out"), total = 0, done = 0, okN = 0, traced = [];
    c.langs.filter(function (l) { return !only || l.lang === only; }).forEach(function (l) {
      var h = document.createElement("h2");
      h.setAttribute("data-lang", l.lang);
      h.innerHTML = (l.name || l.lang) + ' <span class="script">' + l.phrases.map(function (p) { return p.text; }).join(" · ") + "</span>";
      out.appendChild(h);
      var g = document.createElement("div"); g.className = "grid"; g.setAttribute("data-lang", l.lang); out.appendChild(g);
      var seen = {};
      l.phrases.forEach(function (p) {
        (p.chars || []).forEach(function (ch, i) {
          if (seen[ch]) return; seen[ch] = 1;
          total++;
          var cell = document.createElement("div"); cell.className = "card cell";
          cell.innerHTML = '<div class="box ' + (dark ? "lens" : "field-grid") + '"><div class="ink"></div></div>' +
            '<div class="meta"><span class="script"></span><span class="tag">loading</span></div><div class="lbl"></div>';
          cell.querySelector(".script").textContent = ch;
          g.appendChild(cell);
          var ink = WornInk.create(cell.querySelector(".ink"), { theme: dark ? "glasses" : "paper", label: cell.querySelector(".lbl"), api: API });
          ink.load({ lang: l.lang, char: ch, rtl: l.rtl, stroke_url: strokeUrl(l, p, ch, i) }).then(function (n) {
            var k = ink.kind(), lab = LABEL[k] || [k, ""], tag = cell.querySelector(".tag");
            tag.textContent = lab[0] + (k !== "glyph" ? " · " + n : "");
            tag.className = "tag " + lab[1];
            if (k === "glyph") traced.push(l.lang + " " + ch); else okN++;
            ink.loop();
            done++;
            if (done === total) {
              document.getElementById("sum").innerHTML = "<b>" + okN + " of " + total + "</b> characters have stroke-order data." +
                (traced.length ? " Font trace only: " + traced.join(", ") + "." : " Every character animates stroke by stroke.");
            }
          });
        });
      });
    });
  }).catch(function (e) { document.getElementById("sum").textContent = "Couldn't load /content: " + e; });
})();
</script>
</body>
</html>
