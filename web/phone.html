<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Worn Phone</title>
<!-- Backup phone controller (owner: agent C). Open on the iPhone at http://<laptop-ip>:8000/static/web/phone.html
     Does what the iOS app does: pick a phrase -> POST /session -> poll /session/result -> show score -> advance. -->
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#14171c; --dim:#6b7280; --line:#e3e6ea; --accent:#0a84ff; --ok:#16a34a; --fix:#d97706; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0f12; --card:#181b20; --fg:#f2f4f7; --dim:#9aa1ab; --line:#2a2f36; --accent:#4aa8ff; --ok:#3ddc84; --fix:#f5b544; --err:#ff6b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,system-ui,sans-serif;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); -webkit-tap-highlight-color:transparent; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; }
  h1 { margin:0; font-size:24px; letter-spacing:2px; }
  #net { font-size:13px; color:var(--dim); } #net.bad { color:var(--err); }
  #langs { display:flex; overflow-x:auto; gap:8px; padding-bottom:8px; scrollbar-width:none; }
  #langs::-webkit-scrollbar { display:none; }
  #langs button { flex:none; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:8px 14px; font:inherit; font-size:15px; }
  #langs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #phrases { display:grid; gap:8px; margin-top:6px; }
  .phrase { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; border:1px solid var(--line);
    background:var(--card); color:var(--fg); border-radius:12px; padding:12px 14px; font:inherit; }
  .phrase.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .phrase .t { font-size:22px; } .phrase .m { color:var(--dim); font-size:14px; text-align:right; }
  #now { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; display:none; }
  #now.on { display:block; }
  #char { font-size:72px; line-height:1.1; text-align:center; }
  #rom { text-align:center; color:var(--accent); font-weight:600; font-size:20px; }
  #step { text-align:center; color:var(--dim); font-size:14px; margin-top:2px; }
  #status { margin-top:14px; text-align:center; font-size:18px; min-height:52px; }
  #status .score { display:block; font-size:34px; font-weight:700; }
  #status.ok { color:var(--ok); } #status.fix { color:var(--fix); } #status.wait { color:var(--dim); }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row button { flex:1; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:10px; padding:12px 6px; font:inherit; font-size:15px; }
  .row button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row button:disabled { opacity:.4; }
  #err { color:var(--err); font-size:14px; margin-top:10px; min-height:1em; }
</style>
</head>
<body>
<header><h1>WORN</h1><span id="net">connecting…</span></header>
<div id="langs"></div>
<div id="phrases"></div>

<section id="now">
  <div id="char"></div>
  <div id="rom"></div>
  <div id="step"></div>
  <div id="status" class="wait"></div>
  <div class="row">
    <button id="prev">‹ Prev</button>
    <button id="again">Replay on glasses</button>
    <button id="next" class="primary">Next ›</button>
  </div>
</section>
<div id="err"></div>

<script>
"use strict";
const API = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, "");
const AUTO_ADVANCE_MS = 1800;
const $ = id => document.getElementById(id);
let langs = [], lang = null, phrase = null, idx = 0, lastTs = null, advanceTimer = null;

async function api(path, opts) {
  const r = await fetch(API + path, Object.assign({ cache: "no-store" }, opts));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error((await r.text()).slice(0, 160) || r.status);
  return r.json();
}

function renderLangs() {
  $("langs").innerHTML = "";
  langs.forEach(l => {
    const b = document.createElement("button");
    b.textContent = l.name; b.className = lang === l ? "on" : "";
    b.onclick = () => { lang = l; renderLangs(); renderPhrases(); };
    $("langs").appendChild(b);
  });
}
function renderPhrases() {
  $("phrases").innerHTML = "";
  lang.phrases.forEach(p => {
    const b = document.createElement("button");
    b.className = "phrase" + (phrase === p ? " on" : "");
    b.innerHTML = '<span class="t"></span><span class="m"></span>';
    b.querySelector(".t").textContent = p.text; b.querySelector(".t").dir = lang.rtl ? "rtl" : "ltr";
    b.querySelector(".m").textContent = p.meaning;
    b.onclick = () => start(p, 0);
    $("phrases").appendChild(b);
  });
}

async function start(p, i) {
  clearTimeout(advanceTimer);
  phrase = p; idx = i; lastTs = null;
  renderPhrases();
  $("err").textContent = "";
  try {
    await api("/session", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ lang: lang.lang, phrase_id: p.id, char_index: i, mode: "write" }) });
  } catch (e) { $("err").textContent = "Couldn't reach the glasses server: " + e.message; }
  renderNow();
}

function renderNow() {
  $("now").classList.add("on");
  $("char").textContent = phrase.chars[idx];
  $("char").dir = lang.rtl ? "rtl" : "ltr";
  $("rom").textContent = (phrase.romanization || "") + " · " + phrase.meaning;
  $("step").textContent = "Character " + (idx + 1) + " of " + phrase.chars.length;
  setStatus("wait", "Write it on paper, then press the glasses button");
  $("prev").disabled = idx === 0;
}
function setStatus(cls, text, score) {
  const s = $("status"); s.className = cls; s.innerHTML = "";
  if (score != null) { const b = document.createElement("span"); b.className = "score"; b.textContent = score + " / 100"; s.appendChild(b); }
  s.appendChild(document.createTextNode(text));
}

function nextPhrase() {
  const list = lang.phrases, i = list.indexOf(phrase);
  return list[(i + 1) % list.length];
}
function advance() {
  if (idx + 1 < phrase.chars.length) return start(phrase, idx + 1);
  start(nextPhrase(), 0);
}

$("next").onclick = advance;
$("prev").onclick = () => { if (idx > 0) start(phrase, idx - 1); };
$("again").onclick = () => start(phrase, idx);

async function poll() {
  try {
    const r = phrase ? await api("/session/result") : null;
    $("net").textContent = "connected"; $("net").className = "";
    // POST /session clears the server's result, so anything that shows up afterwards is for this character.
    if (r && r.ts !== lastTs && phrase && r.char === phrase.chars[idx]) {
      lastTs = r.ts;
      if (r.correct) {
        setStatus("ok", "✓ " + r.feedback, r.score);
        clearTimeout(advanceTimer); advanceTimer = setTimeout(advance, AUTO_ADVANCE_MS);
      } else {
        setStatus("fix", r.feedback + " Try again.", r.score);
      }
    }
  } catch (e) { $("net").textContent = "offline"; $("net").className = "bad"; }
  setTimeout(poll, 700);
}

(async function boot() {
  try {
    const c = await api("/content");
    langs = ((c && c.langs) || []).filter(l => l.phrases.some(p => p.chars && p.chars.length));  // writing lessons only
    lang = langs[0]; renderLangs(); renderPhrases();
    $("net").textContent = "connected";
  } catch (e) {
    $("net").textContent = "offline"; $("net").className = "bad";
    $("err").textContent = "Can't load lessons. Is the laptop server running and is this phone on the same wifi?";
    setTimeout(boot, 2000); return;
  }
  poll();
})();
</script>
</body>
</html>
