<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Worn Mirror</title>
<!-- Live audience view of what the glasses show (owner: agent C). Landscape iPad first, also works on a phone.
     Served at GET /mirror (backend) or /static/web/mirror.html. Polls /session and /session/result every 500 ms.
     The handwriting photo comes from result.image_url, else GET /capture/latest. -->
<style>
  :root { --bg:#000; --panel:#0c0e12; --line:#232831; --fg:#fff; --dim:#8a93a0; --accent:#5cd6ff; --ok:#3ef08a; --fix:#ffc23d; --bad:#ff4d4d;
    --sq: min(42vw, 60vh); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,system-ui,"Noto Sans","Noto Sans CJK SC","Noto Sans Devanagari","Noto Naskh Arabic",sans-serif; }
  body { display:flex; flex-direction:column; padding:max(14px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }

  header { display:flex; align-items:center; justify-content:space-between; height:min(9vh, 72px); flex:none; }
  .brand { font-size:min(3.2vw, 30px); font-weight:800; letter-spacing:.2em; }
  .brand small { font-weight:500; letter-spacing:.08em; color:var(--dim); font-size:.6em; margin-left:.8em; text-transform:uppercase; }
  #strip { flex:1; text-align:center; font-size:min(5vw, 6vh); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 2vw; }
  #strip span { color:#59606b; margin:0 .08em; }
  #strip span.done { color:#4f7a60; }
  #strip span.cur { color:var(--accent); border-bottom:.08em solid var(--accent); }
  #live { display:flex; align-items:center; font-size:min(2vw, 18px); font-weight:700; letter-spacing:.12em; color:var(--dim); }
  #live i { width:.9em; height:.9em; border-radius:50%; background:var(--ok); margin-right:.5em; box-shadow:0 0 .6em var(--ok); animation:blink 1.6s infinite; }
  #live.down i { background:var(--bad); box-shadow:0 0 .6em var(--bad); animation:none; }
  #live.down { color:var(--bad); }
  @keyframes blink { 50% { opacity:.35; } }

  main { flex:1; display:flex; align-items:center; justify-content:center; gap:3vw; min-height:0; }
  .col { display:flex; flex-direction:column; align-items:center; width:var(--sq); }
  .cap { align-self:stretch; font-size:min(1.6vw, 15px); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:.8vh; display:flex; justify-content:space-between; }
  .sq { position:relative; width:var(--sq); height:var(--sq); border:2px solid var(--line); border-radius:18px; background:var(--panel); overflow:hidden; }
  #board::before, #board::after { content:""; position:absolute; background:var(--line); }
  #board::before { left:50%; top:0; bottom:0; width:1px; }
  #board::after { top:50%; left:0; right:0; height:1px; }
  #anim { position:absolute; inset:3%; }
  #anim svg { display:block; }
  #photo img { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  #photo .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:10%; color:var(--dim); font-size:min(2.2vw, 3vh); }
  #badge { position:absolute; right:3%; top:3%; width:22%; height:22%; border-radius:50%; display:none; align-items:center; justify-content:center;
    font-size:calc(var(--sq) * 0.14); font-weight:800; color:#000; }
  #badge.ok { display:flex; background:var(--ok); } #badge.fix { display:flex; background:var(--fix); }

  .under { align-self:stretch; margin-top:1.6vh; min-height:13vh; }
  #rom { font-size:min(4.6vw, 6vh); font-weight:700; color:var(--accent); line-height:1.1; }
  #meaning { font-size:min(2.8vw, 3.6vh); margin-top:.4vh; }
  #meaning small { color:var(--dim); font-size:.75em; margin-left:.5em; }
  #grade { font-size:min(3.4vw, 4.4vh); font-weight:700; line-height:1.2; }
  #grade.ok { color:var(--ok); } #grade.fix { color:var(--fix); } #grade.wait { color:var(--dim); font-weight:500; }
  #score { font-size:min(2.2vw, 3vh); color:var(--dim); margin-top:.4vh; }

  #idle { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); }
  #idle.on { display:flex; }
  #idle h1 { font-size:min(12vw, 120px); letter-spacing:.2em; }
  #idle p { font-size:min(3vw, 28px); color:var(--dim); margin-top:2vh; }

  @media (orientation: portrait) {
    :root { --sq: min(44vw, 34vh); }
    main { gap:4vw; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">WORN<small id="lang"></small></div>
  <div id="strip"></div>
  <div id="live"><i></i><span id="liveTxt">LIVE</span></div>
</header>

<main>
  <div class="col">
    <div class="cap"><span>On the glasses</span><span id="strokeNo"></span></div>
    <div class="sq" id="board"><div id="anim"></div></div>
    <div class="under"><div id="rom"></div><div id="meaning"></div></div>
  </div>
  <div class="col">
    <div class="cap"><span>Their handwriting</span><span id="counter"></span></div>
    <div class="sq" id="photo"><div class="empty" id="photoEmpty">Waiting for the glasses photo…</div><div id="badge"></div></div>
    <div class="under"><div id="grade" class="wait"></div><div id="score"></div></div>
  </div>
</main>

<div id="idle" class="on"><h1>WORN</h1><p>Waiting for a phrase from the phone…</p></div>

<script src="/static/web/vendor/hanzi-writer.min.js"></script>
<script src="/static/web/worn-strokes.js"></script>
<script>
"use strict";
const API = (new URLSearchParams(location.search).get("api") || "").replace(/\/$/, "");
const POLL_MS = 500, DOWN_AFTER_MS = 2000;
const $ = id => document.getElementById(id);
const strokes = WornStrokes.create($("anim"), $("strokeNo"), API, { ramp: true });  // match the glasses: slow -> faster -> full
let sessionKey = null, session = null, resultKey = null, lastOk = Date.now(), chars = {};

async function getJSON(path) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 1500);
  try {
    const r = await fetch(API + path, { cache: "no-store", signal: ctl.signal });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

function renderSession(s) {
  session = s;
  resultKey = null; renderResult(null);
  if (!s || s.mode !== "write" || !s.char) { strokes.stop(); $("idle").classList.add("on"); return; }
  $("idle").classList.remove("on");
  $("lang").textContent = s.lang_name || s.lang;
  const strip = $("strip"); strip.innerHTML = ""; strip.dir = s.rtl ? "rtl" : "ltr";
  const list = s.rtl ? null : chars[s.lang + "/" + s.phrase_id];   // Arabic: keep the joined word
  (list || [s.text || s.char]).forEach((c, i) => {
    const sp = document.createElement("span"); sp.textContent = c;
    sp.className = !list ? "cur" : i < s.char_index ? "done" : i === s.char_index ? "cur" : "";
    strip.appendChild(sp);
  });
  $("rom").textContent = s.romanization || "";
  $("meaning").innerHTML = "";
  $("meaning").append("“" + (s.meaning || "") + "”");
  $("counter").textContent = "character " + (s.char_index + 1) + " of " + s.total_chars;
  strokes.animate(s);
}

function renderResult(r) {
  const img = $("photo").querySelector("img");
  $("badge").className = ""; $("score").textContent = "";
  if (!r) {
    if (img) img.remove();
    $("photoEmpty").style.display = "flex";
    $("photoEmpty").textContent = "Waiting for the glasses photo…";
    $("grade").className = "wait"; $("grade").textContent = session ? "Writing on paper…" : "";
    return;
  }
  // Prefer result.image_url; else A's GET /capture/latest (the photo /grade just saved), cache-busted by the grade ts.
  const photo = r.image_url || ("/capture/latest?ts=" + encodeURIComponent(r.ts || Date.now()));
  if (photo) {
    const src = (/^https?:/.test(photo) ? photo : API + photo);
    let el = img;
    if (!el) { el = document.createElement("img"); el.alt = "handwriting photo"; $("photo").insertBefore(el, $("badge")); }
    el.onerror = () => { el.remove(); $("photoEmpty").style.display = "flex"; $("photoEmpty").textContent = "Photo couldn't load"; };
    el.src = src;
    $("photoEmpty").style.display = "none";
  } else {
    if (img) img.remove();
    $("photoEmpty").style.display = "flex";
    $("photoEmpty").textContent = "No photo";
  }
  const ok = !!r.correct;
  $("badge").className = ok ? "ok" : "fix"; $("badge").textContent = ok ? "✓" : "↻";
  $("grade").className = ok ? "ok" : "fix";
  $("grade").textContent = (ok ? "✓ " : "") + (r.feedback || (ok ? "Nice!" : "Try again"));
  if (typeof r.score === "number") $("score").textContent = r.score + " / 100";
}

function setLive(up) {
  $("live").classList.toggle("down", !up);
  $("liveTxt").textContent = up ? "LIVE" : "OFFLINE";
}

async function loadContent() {
  const c = await getJSON("/content");
  (c && c.langs || []).forEach(l => l.phrases.forEach(p => { if (p.chars && p.chars.length) chars[l.lang + "/" + p.id] = p.chars; }));
}

async function tick() {
  try {
    if (!Object.keys(chars).length) await loadContent();
    const [s, r] = await Promise.all([getJSON("/session"), getJSON("/session/result")]);
    lastOk = Date.now(); setLive(true);
    const sk = s ? [s.version, s.lang, s.phrase_id, s.char_index, s.mode].join("|") : "";
    if (sk !== sessionKey) { sessionKey = sk; renderSession(s); }
    // Only show a grade that belongs to the character on screen.
    const fresh = r && session && (!r.char || r.char === session.char) ? r : null;
    const rk = fresh ? String(fresh.ts) : null;
    if (rk !== resultKey) { resultKey = rk; renderResult(fresh); }
  } catch (e) {
    if (Date.now() - lastOk > DOWN_AFTER_MS) setLive(false);
  }
  setTimeout(tick, POLL_MS);
}
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (session && session.char) strokes.animate(session); }, 250); });
setInterval(() => { if (Date.now() - lastOk > DOWN_AFTER_MS) setLive(false); }, 500);
tick();
</script>
</body>
</html>
